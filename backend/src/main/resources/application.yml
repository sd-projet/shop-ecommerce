server:
  port: ${PORT:8080}   # Render fournit PORT

spring:
  application:
    name: ecommerce-backend
  config:
    import: optional:file:.env[.properties]   # charge backend/.env s'il existe (lancement sans Docker)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 30000      # laisse le temps à Neon de se réveiller (scale-to-zero)
      max-lifetime: 240000           # Neon coupe les connexions inactives : on les recycle avant
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  jwt:
    # >= 32 bytes. CHANGE IN PRODUCTION (use an environment variable / secret manager).
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: 120
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  admin:
    email: ${ADMIN_EMAIL:admin@shop.com}
    password: ${ADMIN_PASSWORD:Admin123!}
  payment:
    provider: ${PAYMENT_PROVIDER:fake}      # fake | stripe
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    mode: ${MAIL_MODE:log}                  # log | smtp
    from: no-reply@shop.local

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
