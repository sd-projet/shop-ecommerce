# Lance la plateforme avec Neon comme base de données (pas de PostgreSQL local) :
#   docker compose -f docker-compose.neon.yml --env-file .env up --build
services:
  maildev:
    image: maildev/maildev
    ports:
      - "1080:1080"
      - "1025:1025"

  backend:
    build: ./backend
    environment:
      DB_URL: ${NEON_JDBC_URL:?Renseignez NEON_JDBC_URL dans .env}
      DB_USER: ${NEON_USER:?Renseignez NEON_USER dans .env}
      DB_PASSWORD: ${NEON_PASSWORD:?Renseignez NEON_PASSWORD dans .env}
      DB_POOL_SIZE: 5
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-1234}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shop.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      MAIL_MODE: smtp
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"
